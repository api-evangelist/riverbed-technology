aid: riverbed-technology
name: Riverbed Technology
description: >-
  Riverbed Technology is an enterprise unified observability and digital-experience-management
  (DEM) company. Its platform spans network, application, infrastructure, cloud, and end-user
  experience monitoring. Core products include the Aternity DEM suite (employee, mobile, and
  customer experience), AppResponse / NetProfiler / NetIM network observability, SteelHead WAN
  optimization and the Data Express high-speed data movement service, and the Riverbed IQ AIOps
  intelligence layer for autonomous IT operations. Riverbed exposes secure APIs and a 50+ partner
  integrations library (ServiceNow, Splunk, PagerDuty, Slack, Microsoft Teams, and more) so teams
  can build and customize their own observability, ITSM, and automation workflows. Originally added
  to the API Evangelist network as a portfolio lead, this profile has been enriched from Riverbed's
  public trust, security, and developer surfaces.
